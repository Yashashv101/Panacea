spring.application.name=Panacea

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/panacea}
spring.datasource.username=${DB_USERNAME:panacea}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

panacea.security.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-of-at-least-32-bytes}
panacea.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

panacea.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
panacea.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
